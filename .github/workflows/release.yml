# Builds the addon zip and attaches it to a GitHub release.
#
# The point of this is folder naming. WoW requires an addon's folder to match
# its .toc filename, but GitHub's "Download ZIP" button produces
# say-what-main/, which does not. The asset built here unpacks straight into
# Interface\AddOns as SayWhat/.
#
# Triggered by any tag, whatever it's called, because a release that doesn't
# get its asset attached is worse than one built from an oddly named tag. The
# version comes from the .toc, not from the tag, so bump
# "## Version:" in SayWhat/SayWhat.toc before tagging.
#
# Works whether you push a tag or publish a release from the web UI, which
# creates the tag and fires this the same way. It can also be run by hand from
# the Actions tab, naming the tag to create or attach to, which is how you cut
# a release without a local clone.

name: Release

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or attach to, e.g. SayWhat-v1.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run the test suite
        run: lua5.1 tests/run.lua

      # A tag push brings its own name; a manual run is told one.
      - name: Work out which tag we're releasing
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing as $tag"

      # tools/package.sh builds the zip and asserts it contains
      # SayWhat/SayWhat.toc, so the check lives in one place and anyone can
      # run the same thing locally.
      - name: Build the addon zip
        id: build
        run: echo "asset=$(sh tools/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Show what's in it
        run: |
          unzip -l "${{ steps.build.outputs.asset }}"
          echo "### ${{ steps.build.outputs.asset }}" >> "$GITHUB_STEP_SUMMARY"
          grep '^## Version:' SayWhat/SayWhat.toc >> "$GITHUB_STEP_SUMMARY"

      # Two ways to get here: pushing a tag, or publishing a release from the
      # web UI (which creates the tag, firing this same workflow). In the
      # second case the release already exists, so attach the asset to it
      # rather than failing on a duplicate.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="${{ steps.build.outputs.asset }}"
          tag="${{ steps.tag.outputs.name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists, uploading the asset to it."
            gh release upload "$tag" "$asset" --clobber
          else
            # --target creates the tag at this commit when it doesn't exist,
            # which is what a manual run needs. It's ignored for a tag push.
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "SayWhat $tag" \
              --generate-notes \
              "$asset"
          fi
